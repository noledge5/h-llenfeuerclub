<div class="sndbar" id="sndbar" role="region" aria-label="Tonleiste">
  <button class="btn sm ember" id="audioOn" type="button">Ton aktivieren</button>
  <div class="now" id="nowPlay"><b>Musik</b><span>–</span></div>
  <button class="btn sm quiet" id="fxToggle" type="button" aria-expanded="false">Effekte</button>
  <div class="hotbar" id="fxBar"></div>
  <button class="btn sm quiet" id="duckBtn" type="button" aria-pressed="false" title="Musik leiser, solange du vorliest (D)">Vorlesen</button>
  <button class="btn sm danger" id="panicBtn" type="button">Alles ausblenden</button>
</div>
